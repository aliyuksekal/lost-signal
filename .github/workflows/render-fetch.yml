name: 2 - Sonucu al (Kaggle -> Releases)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      wait:
        description: "Render bitene kadar bekle"
        type: boolean
        default: false
      slug:
        description: "Kaggle kernel adı"
        type: string
        default: lost-signal-render

permissions:
  contents: write

env:
  KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_SLUG: ${{ inputs.slug || 'lost-signal-render' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ayar yoksa çık
        id: cfg
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ] || [ -z "$KAGGLE_USERNAME" ]; then echo "ok=0" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi

      - name: Kullanıcı adını temizle
        if: steps.cfg.outputs.ok == '1'
        run: |
          U=$(python3 - <<'PY'
          import os, re
          u = os.environ.get("KAGGLE_USERNAME", "").strip()
          u = re.sub(r"^https?://", "", u)
          u = re.sub(r"^(www\.)?kaggle\.com/", "", u)
          u = u.strip("/").lstrip("@").split("/")[0].strip().lower()
          print(u)
          PY
          )
          if ! echo "$U" | grep -Eq '^[a-z0-9][a-z0-9_-]*$'; then
            echo "::error::KAGGLE_USERNAME geçersiz (uzunluk ${#U}). Sadece kullanıcı adı olmalı: e-posta, boşluk ya da ad-soyad değil. Kaggle profil adresindeki kaggle.com/ sonrası kısım."
            exit 1
          fi
          echo "KAGGLE_USERNAME=$U" >> $GITHUB_ENV

      - name: Kaggle aracını kur
        if: steps.cfg.outputs.ok == '1'
        run: pip install -q -U kaggle

      - name: Durumu kontrol et
        if: steps.cfg.outputs.ok == '1'
        id: st
        run: |
          W="${{ inputs.wait }}"
          if [ "$W" = "true" ]; then sleep 180; fi
          for i in $(seq 1 68); do
            S=$(kaggle kernels status "$KAGGLE_USERNAME/$KERNEL_SLUG" 2>&1 || true)
            echo "$(date -u +%H:%M) $S"
            L=$(echo "$S" | tr 'A-Z' 'a-z')
            if echo "$L" | grep -q "complete"; then echo "state=complete" >> $GITHUB_OUTPUT; exit 0
            elif echo "$L" | grep -q "error"; then echo "state=error" >> $GITHUB_OUTPUT; exit 0; fi
            if [ "$W" != "true" ]; then echo "state=other" >> $GITHUB_OUTPUT; exit 0; fi
            sleep 300
          done
          echo "state=other" >> $GITHUB_OUTPUT

      - name: Çıktıyı indir ve yayınla
        if: steps.st.outputs.state == 'complete' || steps.st.outputs.state == 'error'
        run: |
          mkdir -p out
          kaggle kernels output "$KAGGLE_USERNAME/$KERNEL_SLUG" -p out || true
          ls -la out
          if [ ! -f out/job.json ]; then echo "job.json yok, atlanıyor"; exit 0; fi
          NAME=$(python3 -c "import json;print(json.load(open('out/job.json'))['name'])")
          TAG="render-$NAME"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Zaten yayınlandı: $TAG"; exit 0; fi
          FILES=$(ls out/*.mp4 out/*.png out/*.jpg out/*.json out/*.txt 2>/dev/null | grep -v "/job.json" || true)
          if ls out/*.mp4 >/dev/null 2>&1; then TITLE="🎬 $NAME hazır"; NOTE="Videoyu aşağıdaki Assets bölümünden indir."; else TITLE="⚠️ $NAME hata verdi"; NOTE="Video çıkmadı. render_log.txt dosyasına bak ya da Claude'a gönder."; fi
          gh release create "$TAG" $FILES -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTE"
