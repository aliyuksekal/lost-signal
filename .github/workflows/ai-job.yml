name: 3 - Gerçekçi AI işi (Kaggle GPU)

# jobs/ai/ klasörüne yeni bir iş dosyası (JSON) eklenince otomatik başlar.
on:
  push:
    branches: [main]
    paths: ["jobs/ai/*.json"]
  workflow_dispatch:
    inputs:
      job_file:
        description: "İş dosyası (örn. jobs/ai/001_poc.json)"
        required: true

env:
  KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  KERNEL_SLUG: lost-signal-ai

concurrency:
  group: kaggle-ai
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Kullanıcı adını temizle
        run: |
          U=$(echo "$KAGGLE_USERNAME" | sed -E 's#^https?://##; s#^(www\.)?kaggle\.com/##; s#^@##' | cut -d/ -f1 | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          echo "KAGGLE_USERNAME=$U" >> $GITHUB_ENV

      - name: İş dosyasını bul
        run: |
          F="${{ inputs.job_file }}"
          if [ -z "$F" ]; then F=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/ai/*.json' | tail -1); fi
          echo "İş: $F"; test -f "$F"
          echo "JOB_FILE=$F" >> $GITHUB_ENV

      - name: Kaggle'a gönder
        run: |
          pip install -q -U kaggle
          mkdir -p build
          python3 - <<'PY'
          import json, os
          job = json.load(open(os.environ["JOB_FILE"]))
          job.setdefault("ref", "main")
          src = open("kaggle/ai_template.py").read().replace("__JOB__", json.dumps(job))
          open("build/run.py", "w").write(src)
          meta = {"id": "%s/%s" % (os.environ["KAGGLE_USERNAME"], os.environ["KERNEL_SLUG"]),
                  "title": os.environ["KERNEL_SLUG"], "code_file": "run.py", "language": "python",
                  "kernel_type": "script", "is_private": True, "enable_gpu": True, "enable_internet": True,
                  "dataset_sources": [], "competition_sources": [], "kernel_sources": []}
          json.dump(meta, open("build/kernel-metadata.json", "w"), indent=1)
          PY
          kaggle kernels push -p build

  collect:
    needs: start
    permissions:
      contents: write
    uses: ./.github/workflows/render-fetch.yml
    with:
      wait: true
      slug: lost-signal-ai
    secrets: inherit
